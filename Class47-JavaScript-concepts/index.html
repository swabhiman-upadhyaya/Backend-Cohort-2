<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script> 
    console.log(`5 + 1 = ${"5" + 1}`)  // 51
    console.log(`5 - 1 = ${"5" - 1}`)  // 4
    console.log(`5 * 5 = ${"5" * 5}`)  // 25
    console.log(`5 / 5 = ${"5" / 5}`)  // 1

    /* true ~= 1 AND false ~= 0 */
    console.log(`true + true = ${true + true}`) // 2
    console.log(`true - true = ${true - true}`) // 0
    console.log(`true * true = ${true * true}`) // 1
    console.log(`true / true = ${true / true}`) // 1

    /* [] ~= 0 */
    console.log(`[] + [] = ${[] + []}`) // ""
    console.log(`[] - [] = ${[] - []}`) // 0
    console.log(`[] * [] = ${[] * []}`) // 0
    console.log(`[] / [] = ${[] / []}`) // NaN

    /* [1] ~= 1 exception = "1" in true */
    console.log(`[1] + 1 = ${[1] + 1}`) // 11
    console.log(`[1] - 1 = ${[1] - 1}`) // 0
    console.log(`[1] * 1 = ${[1] * 1}`) // 1
    console.log(`[1] / 1 = ${[1] / 1}`) // 1

    console.log(`[1,2] + 1 = ${[1,2] + 1}`) // 1,21

    console.log([] + {})
  </script>
</body>
</html>
